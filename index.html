<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本机 HTML 发布站</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 24px;
      font: 16px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      padding: 32px;
      border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
      border-radius: 18px;
    }
    code { padding: 2px 6px; border-radius: 6px; background: color-mix(in srgb, currentColor 10%, transparent); }
  </style>
</head>
<body>
  <main>
    <h1>HTML 发布站已启用</h1>
    <p>这个仓库通过 GitHub Pages 发布静态 HTML 文件。</p>
    <p>将文件提交到仓库根目录后，可通过 <code>站点地址/文件名.html</code> 从外部访问。</p>
    <p><strong>注意：</strong>这是公开站点，请勿上传密码、客户信息、订单资料或其他敏感内容。</p>
  </main>
</body>
</html>
